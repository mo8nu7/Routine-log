<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Routine Log UI</title>

  <!-- 서체: "고급스러운 느낌"의 serif + 한글 지원 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg: #fbf7f3;
      --ink: #7a3b12;
      --muted: rgba(122, 59, 18, .55);

      --gap: 18px;
      --radius: 22px;

      /* 카드(일출) 톤 */
      --sun-1: #f6a07f;   /* peach */
      --sun-2: #f9c07a;   /* orange */
      --sun-3: #fff1c0;   /* warm light */
      --sun-4: #f3a46c;   /* deeper orange */
      --card-border: rgba(122, 59, 18, .10);
    }

    *{ box-sizing:border-box; }
    html, body{ height:100%; margin:0; }
    body{
      background: var(--bg);
      color: var(--ink);
      font-family: "Noto Serif KR", ui-serif, Georgia, "Times New Roman", Times, serif;
      letter-spacing: 0.02em;
    }

    /* 화면 전체 패딩 */
    .page{
      min-height: 100vh;
      padding: 22px 18px 18px;
      display: grid;
      grid-template-rows: auto 1fr; /* 상단(시간/달력) + 아래(카드들) */
      gap: 16px;
    }

    /* 상단: 시간(좌) / 달력(우) */
    .top{
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: start;
      gap: 12px;
    }

    .time{
      font-size: 56px;
      font-weight: 600;
      line-height: 1;
      margin-top: 2px;
      white-space: nowrap;
    }
    .ampm{
      font-size: 22px;
      margin-left: 10px;
      vertical-align: baseline;
      opacity: .95;
    }

    .calendar{
      justify-self: end;
      text-align: center;
      width: 100%;
      max-width: 340px;
    }
    .cal-title{
      font-size: 30px;
      font-weight: 600;
      margin: 0 0 10px;
    }
    .cal-grid{
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 10px 10px;
      font-size: 18px;
      color: var(--muted);
    }
    .dow{
      font-size: 18px;
      color: var(--ink);
      opacity: .9;
      padding-bottom: 6px;
    }
    .day{
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      color: rgba(122, 59, 18, .65);
    }
    .day.is-today{
      background: rgba(249, 192, 122, .35);
      color: var(--ink);
      font-weight: 600;
    }
    .day.is-out{
      opacity: .25;
    }

    /* 아래 카드 영역: 왼쪽(2개) + 오른쪽(세로 1개) */
    .cards{
      display: grid;
      grid-template-columns: 2.1fr 1fr;
      gap: var(--gap);
      align-items: stretch; /* 높이 맞추기 */
    }

    /* 왼쪽은 5:1 비율 */
    .left{
      display: grid;
      grid-template-rows: 5fr 1fr;
      gap: var(--gap);
      min-height: 0;
    }

    /* 오른쪽은 왼쪽 전체 높이와 동일(같은 grid row) */
    .right{
      min-height: 0;
    }

    .card{
      border-radius: var(--radius);
      border: 1px solid var(--card-border);
      overflow: hidden;
      background:
        radial-gradient(900px 520px at 50% 70%, rgba(255,241,192,.95), transparent 62%),
        radial-gradient(700px 460px at 35% 40%, rgba(249,192,122,.55), transparent 60%),
        radial-gradient(900px 600px at 70% 18%, rgba(246,160,127,.75), transparent 62%),
        linear-gradient(180deg, rgba(246,160,127,.90), rgba(249,192,122,.75) 55%, rgba(243,164,108,.55));
    }

    /* 화면이 작은 모바일에서 비율 유지 + 자연스러운 높이 */
    @media (max-width: 430px){
      .time{ font-size: 52px; }
      .cal-title{ font-size: 28px; }
      .cal-grid{ font-size: 17px; }
    }

    /* 아주 작은 기기면 달력 글자 살짝 줄임 */
    @media (max-width: 360px){
      .time{ font-size: 46px; }
      .cal-title{ font-size: 24px; }
      .cal-grid{ font-size: 16px; gap: 8px; }
    }
    /* 📱 모바일 전용 (iPhone 기준 최적화) */
@media (max-width: 430px){

  /* 전체 여백 축소 */
  .page{
    padding: 12px;
    gap: 8px;
  }

  /* 상단 영역 압축 */
  .top{
    grid-template-columns: 1.1fr 0.9fr;
    gap: 6px;
    align-items: start;
  }

  .time{
    font-size: 40px;     /* ⬅️ 핵심: 시간 줄이기 */
    line-height: 1;
  }
  .ampm{
    font-size: 14px;
    margin-left: 6px;
  }

  .cal-title{
    font-size: 20px;
    margin-bottom: 4px;
  }

  .cal-grid{
    font-size: 13px;
    gap: 4px;
  }
  .day{
    height: 22px;
  }

  /* ⭐ 핵심: 카드 영역을 화면에 맞게 고정 */
  .cards{
    height: calc(100vh - 170px); /* 상단 높이 제외 */
    min-height: 380px;
    grid-template-columns: 2.5fr 1fr; /* 모바일용 비율 */
    gap: 10px;
    align-items: stretch;
  }

  .left{
    grid-template-rows: 5fr 1fr; /* 네가 원하는 비율 */
    gap: 10px;
  }

  .card{
    border-radius: 18px;
  }
}

  </style>
</head>

<body>
  <div class="page">
    <!-- TOP -->
    <div class="top">
      <div class="time" id="time">--:--<span class="ampm">--</span></div>

      <div class="calendar">
        <h2 class="cal-title" id="calTitle">----년 --월</h2>
        <div class="cal-grid" id="calGrid">
          <!-- JS로 채움 -->
        </div>
      </div>
    </div>

    <!-- CARDS -->
    <div class="cards">
      <div class="left">
        <div class="card" aria-label="left-top-card"></div>
        <div class="card" aria-label="left-bottom-card"></div>
      </div>
      <div class="right card" aria-label="right-tall-card"></div>
    </div>
  </div>

  <script>
    // 한국 로컬(사용자 브라우저 기준)로 시간 표시
    function pad2(n){ return String(n).padStart(2, "0"); }

    function updateTime(){
      const now = new Date();
      let h = now.getHours();
      const m = now.getMinutes();

      const isPM = h >= 12;
      const ampm = isPM ? "PM" : "AM";

      // 12시간제로 표시(00->12)
      let h12 = h % 12;
      if (h12 === 0) h12 = 12;

      document.getElementById("time").innerHTML =
        `${pad2(h12)}:${pad2(m)}<span class="ampm">${ampm}</span>`;
    }

    // 달력 생성: 현재 달 + 오늘 하이라이트
    function buildCalendar(){
      const now = new Date();
      const year = now.getFullYear();
      const month = now.getMonth(); // 0-11
      const today = now.getDate();

      const calTitle = document.getElementById("calTitle");
      calTitle.textContent = `${year}년 ${month + 1}월`;

      const grid = document.getElementById("calGrid");
      grid.innerHTML = "";

      const dow = ["일","화","수","목","금","토","일"];
      // (주의) 사용자가 원하는 표기는 "일 화 수 목 금 토 일" 이었는데,
      // 실제 달력은 일~토 7개가 정석이라서 일~토로 구성.
      // 만약 '일'을 양쪽에 두고 싶으면 말해줘. 그대로 맞춰줄게.
      const dow2 = ["일","화","수","목","금","토","일"]; // 사용자가 원한 스타일 느낌 유지
      // 첫 7개만 쓰되, "일" 중복을 피하려면 dow로 교체하면 됨.
      const header = ["일","화","수","목","금","토","일"].slice(0,7);

      // 요일 헤더
      header.forEach(d=>{
        const el = document.createElement("div");
        el.className = "dow";
        el.textContent = d;
        grid.appendChild(el);
      });

      // 이번 달 1일의 요일 (0=일)
      const first = new Date(year, month, 1);
      const firstDow = first.getDay();

      // 이번 달 마지막 날짜
      const lastDay = new Date(year, month + 1, 0).getDate();

      // 앞쪽 빈칸(이전 달 날짜로 채우면 더 예쁨)
      const prevLastDay = new Date(year, month, 0).getDate();
      for(let i=0;i<firstDow;i++){
        const dayNum = prevLastDay - (firstDow - 1 - i);
        const el = document.createElement("div");
        el.className = "day is-out";
        el.textContent = dayNum;
        grid.appendChild(el);
      }

      // 이번 달 날짜
      for(let d=1; d<=lastDay; d++){
        const el = document.createElement("div");
        el.className = "day";
        el.textContent = d;
        if(d === today) el.classList.add("is-today");
        grid.appendChild(el);
      }

      // 뒤쪽 빈칸(다음 달 날짜)
      // 총 셀(헤더 제외)이 6주(42칸) 정도로 맞춰지게 채움
      const cellsNow = firstDow + lastDay;
      const fill = (cellsNow <= 35) ? (35 - cellsNow) : (42 - cellsNow);
      for(let d=1; d<=fill; d++){
        const el = document.createElement("div");
        el.className = "day is-out";
        el.textContent = d;
        grid.appendChild(el);
      }
    }

    // 실시간 갱신: 분이 바뀌면 화면도 바뀌게
    function start(){
      updateTime();
      buildCalendar();

      // 1초마다 갱신(초까지 표시 안 하지만 분 바뀜을 바로 반영)
      setInterval(updateTime, 1000);

      // 날짜가 바뀌는 경우 달력도 갱신 필요:
      // 1분마다 날짜 변화 체크해서 바뀌면 rebuild
      let lastDate = new Date().toDateString();
      setInterval(()=>{
        const now = new Date().toDateString();
        if(now !== lastDate){
          lastDate = now;
          buildCalendar();
        }
      }, 60 * 1000);
    }

    start();
  </script>
</body>
</html>
